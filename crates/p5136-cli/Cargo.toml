[package]
name = "p5136-cli"
description = "Desktop and command-line entry point for the KartRider P5136 Rust port"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "p5136"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
local-ip-address.workspace = true
p5136-connector = { path = "../p5136-connector" }
p5136-core = { path = "../p5136-core" }
p5136-profile = { path = "../p5136-profile" }
p5136-server = { path = "../p5136-server" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3.23"

[lints]
workspace = true
