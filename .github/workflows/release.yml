name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-2022

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libxcb-render0-dev
          libxcb-shape0-dev
          libxcb-xfixes0-dev
          libxkbcommon-dev
          libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Build release binary
        run: cargo build -p p5136-cli --release --locked

      - name: Build and test Win32 XUN sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S native/p5136-xun-sidecar `
            -B target/p5136-finish-kart-abilities/xun-sidecar-win32 `
            -G "Visual Studio 17 2022" -A Win32
          cmake --build target/p5136-finish-kart-abilities/xun-sidecar-win32 `
            --config Release
          ctest --test-dir target/p5136-finish-kart-abilities/xun-sidecar-win32 `
            -C Release --output-on-failure
          cmake --install target/p5136-finish-kart-abilities/xun-sidecar-win32 `
            --config Release --prefix package-root

      - name: Package release binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          platform="$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/p5136-finish-kart-abilities/release/p5136.exe "dist/p5136-${platform}-${arch}.exe"
            cp target/p5136-finish-kart-abilities/release/p5136.exe package-root/p5136.exe
            mkdir -p package-root/startup-proxy
            mv package-root/dinput8.dll package-root/startup-proxy/dinput8.dll
            cp README.md README.en.md README.zh-CN.md CHANGELOG.md WINDOWS_SERVER_2012.md package-root/
            cp native/p5136-xun-sidecar/README.md package-root/XUN-SIDECAR.md
            pwsh -NoLogo -NoProfile -NonInteractive -Command \
              "Compress-Archive -Path 'package-root/*' -DestinationPath 'dist/p5136-${platform}-${arch}.zip' -CompressionLevel Optimal"
          else
            tar -czf "dist/p5136-${platform}-${arch}.tar.gz" \
              -C target/p5136-finish-kart-abilities/release p5136
          fi

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: p5136-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum p5136-* > SHA256SUMS
          )

      - name: Prepare Korean release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## " version " ") == 1 { copy=1; next }
            copy && /^## / { exit }
            copy { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --notes-file release-notes.md
          --title "P5136 Rust $GITHUB_REF_NAME"
