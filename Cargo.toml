[workspace]
members = [
    "crates/p5136-cli",
    "crates/p5136-connector",
    "crates/p5136-core",
    "crates/p5136-server",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AFL-3.0"
rust-version = "1.94"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.49", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
